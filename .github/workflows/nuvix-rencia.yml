          B64EOF
          echo "3c0c0f9d7647749ee2abe91f593fd01b2919a4db38e0bd31c34de1971f2775c0  work/module.dex" | sha256sum -c -

          # 1) smali do modulo: Railway primeiro, reserva Manus, __idle__, ordem do heartbeat, Assistindo
          : > work/applied.txt
          baksmali d work/module.dex -o work/smali_module
          python3 patch_infinitus.py work/smali_module work/applied.txt
          # Mantem a identidade visual e o nome do IMPÉRIO PLAYER do APK de origem.
          sort -u work/applied.txt > work/applied_u.txt
          echo "Patches aplicados:"; cat work/applied_u.txt
          for P in host_check reserva_manus painel painel_home rotas_magnus comandos_magnus heartbeat heartbeat_comando sync_imediato observador; do
            grep -qx "$P" work/applied_u.txt || { echo "ERRO: patch '$P' nao foi aplicado"; exit 1; }
          done
          VER=$(head -c 7 work/module.dex | tail -c 3)
          case "$VER" in 037) API=24 ;; 038) API=26 ;; 039) API=28 ;; *) API=15 ;; esac
          echo "modulo: dex versao $VER -> smali --api $API"
          NDEX=$(ls work/dex/classes*.dex | wc -l)
          MODDEX="classes$((NDEX + 1)).dex"
          WATCHDEX="classes$((NDEX + 2)).dex"
          smali a --api "$API" work/smali_module -o "work/new/$MODDEX"

          # 2) codigo novo (Assistindo): compila e vira um dex a parte
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          ANDROID_JAR=$(ls "$ANDROID_SDK_ROOT"/platforms/android-*/android.jar | sort -V | tail -1)
          echo "build-tools: $BT | android.jar: $ANDROID_JAR"
          javac -nowarn -Xlint:-options --release 8 -cp "$ANDROID_JAR" -d work/jc src/com/legacy/prime/rencia/InfinitusWatch.java
          "$BT/d8" --release --min-api 21 --lib "$ANDROID_JAR" --output work/d8 $(find work/jc -name '*.class')
          cp work/d8/classes.dex "work/new/$WATCHDEX"
          echo "dex do modulo: $MODDEX | dex do Assistindo: $WATCHDEX"

          # 3) manifesto: Rencia vira a tela inicial e entra o servico
          python3 axml_patch.py work/manifest/AndroidManifest.xml work/new/AndroidManifest.xml

          # 4) monta o APK
          cp "$APK" work/unsigned.apk
          zip -q -d work/unsigned.apk 'META-INF/*' || true
          (cd work/new && zip -q ../unsigned.apk AndroidManifest.xml "$MODDEX" "$WATCHDEX")
          "$BT/zipalign" -p -f 4 work/unsigned.apk work/aligned.apk
          OUT="ImperioPlayer-Magnus-Railway.apk"
          "$BT/apksigner" sign --ks nuvix.keystore --ks-key-alias nuvix \
            --ks-pass pass:nuvix-test-key --key-pass pass:nuvix-test-key \
            --out "$OUT" work/aligned.apk
          "$BT/apksigner" verify --verbose "$OUT"

          # conferencia: o Android precisa entender o manifesto novo
          "$BT/aapt2" dump badging "$OUT" | grep -E "^package|launchable-activity|sdkVersion" | head -5
          "$BT/aapt2" dump badging "$OUT" | grep -q "launchable-activity: name='com.legacy.prime.rencia.RenciaGateActivity'" || { echo "ERRO: tela inicial nao e o RenciaGateActivity"; exit 1; }
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$OUT" | grep -E "RenciaSyncService|RenciaGateActivity" | head -4

          python3 - <<'PYEOF'
          import zipfile
          z = zipfile.ZipFile("ImperioPlayer-Magnus-Railway.apk")
          names = z.namelist()
          dexnames = [n for n in names if n.startswith("classes") and n.endswith(".dex")]
          dex = b"".join(z.read(n) for n in dexnames)
          assert b"renciaapp-production.up.railway.app" in dex, "Railway nao encontrado no APK final"
          for n in dexnames:
              raw = z.read(n)
              if b"renciaapp.manus.space" in raw:
                  assert b"Lcom/legacy/prime/rencia/RenciaBackend;" in raw and b"shouldFallback" in raw, "Manus fora da reserva em " + n
          assert b"/api/v5/apps/magnus/config?mac=" in dex, "Rota de config Magnus ausente"
          assert b"&app=magnus" in dex, "Identificador app=magnus ausente nos comandos"
          assert b"__idle__" in dex, "Sentinela __idle__ ausente"
          assert any(b"Lcom/legacy/prime/rencia/InfinitusWatch;" in z.read(n) and b"infinitus_sync_now" in z.read(n) for n in dexnames), "Assistindo ausente"
          assert b"Lcom/legacy/prime/rencia/RenciaGateActivity;" in dex, "Tela do Rencia ausente"
          assert "resources.arsc" in names
          print("OK: Império Play com Magnus, Railway primeiro, Manus de reserva elegivel, __idle__ e Assistindo presentes")
          PYEOF
          sha256sum "$OUT"

      - name: Guardar o APK ajustado
        uses: actions/upload-artifact@v4
        with:
          name: ImperioPlayer-Magnus-Railway
          path: ImperioPlayer-Magnus-Railway.apk
